[package]
name = "cosmic-applet-claude-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet showing Claude plan usage as two stacked bars with a pace marker"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
claude-usage-core = { path = "../../libs/claude-usage-core", features = ["usage-text"] }
serde_json = "1"
# Already in libcosmic's lockfile; "process" runs `claude`, "time" bounds it.
tokio = { version = "1", features = ["process", "time", "rt", "macros"] }

# Pinned to the libcosmic rev in cosmic-applets 328d142 (COSMIC 1.11.0) Cargo.lock.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "430f3d48a97d8779f9c1985473912e594ccca1ae"
default-features = false
features = ["applet", "applet-token", "multi-window", "tokio", "wayland", "winit"]
