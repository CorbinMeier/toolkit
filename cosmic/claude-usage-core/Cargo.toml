[package]
name = "claude-usage-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared Claude plan-usage code: reading types, pace math, status-line feed, words"

[features]
# The `claude -p /usage` text parser; pulls regex and chrono-tz.
usage-text = ["dep:regex", "dep:chrono-tz"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
chrono-tz = { version = "0.10", optional = true }
regex = { version = "1", optional = true }
